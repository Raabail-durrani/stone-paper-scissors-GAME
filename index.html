<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="scriipt.js" defer></script>
</head>
<body>
    <header>
        <h1>Rock Paper Scissors</h1>
    </header>
    <div class="winner">
        <p class="winmsg">Play your move</p>
    </div>
    <div class="container">
        <button class="circle1">✊</button>
        <button class="circle2">✋</button>
        <button class="circle3">✌️</button>
    </div>
    <div class="score-board">
        <div class="score" >
            <p class="user-score">0</p>
            <h2>User</h2>
        </div>
        <div class="score">
            <p class="comp-score">0</p>
            <h2>Computer</h2>
        </div>
    </div>
</body>
</html>
